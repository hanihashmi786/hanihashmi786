<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">Hani Mustafa Hashmi — Software Engineer</title>
  <desc id="d">Python and full-stack software engineer based in Riyadh, working on backend APIs, mobile apps and applied AI.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#1A2438"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0B1220" stop-opacity="1"/>
      <stop offset=".55" stop-color="#0B1220" stop-opacity=".85"/>
      <stop offset="1" stop-color="#0B1220" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes rot { 0% {opacity:1} 23.00% {opacity:1} 25.00% {opacity:0} 98% {opacity:0} 100% {opacity:1} }
      .ln { opacity:0; animation: rot 14.0s linear infinite; } .l0 { opacity:1; }
      .l0 { animation-delay: 0.00s; }
      .l1 { animation-delay: -10.50s; }
      .l2 { animation-delay: -7.00s; }
      .l3 { animation-delay: -3.50s; }
      @keyframes flow { from { stroke-dashoffset: 230 } to { stroke-dashoffset: 0 } }
      .flow { animation: flow 2.8s linear infinite; }
      .f1 { animation-delay: .7s } .f2 { animation-delay: 1.4s } .f3 { animation-delay: 2.1s }
      @keyframes pulse { 0% { r:30; opacity:.7 } 100% { r:52; opacity:0 } }
      .pulse { animation: pulse 2.8s ease-out infinite; }
      @media (prefers-reduced-motion: reduce) { .ln,.flow,.pulse { animation:none } .l0 { opacity:1 } .flow,.pulse { opacity:0 } }
    </style>
  </defs>
  <rect width="1280" height="340" rx="18" fill="#0B1220"/>
  <rect width="1280" height="340" rx="18" fill="url(#dots)"/>
  <rect width="900" height="340" rx="18" fill="url(#fade)"/>
  <rect x="0.75" y="0.75" width="1278.5" height="338.5" rx="17.5" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <rect x="72" y="66" width="4" height="96" rx="2" fill="#2DD4BF"/>
  <text x="96" y="96" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" letter-spacing="3" fill="#8B9BB4">SOFTWARE ENGINEER  ·  RIYADH, KSA</text>
  <text x="94" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="54" font-weight="700" letter-spacing="-1" fill="#E6EDF7">Hani Mustafa Hashmi</text>
  <text x="96" y="196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" fill="#8B9BB4">Python backends, mobile apps, and the <tspan fill="#2DD4BF" font-weight="600">AI</tspan> that makes them useful.</text>

  <rect x="72" y="230" width="680" height="48" rx="10" fill="#111A2E" stroke="#1E293B" stroke-width="1.5"/>
  <text x="88" y="263" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="20" fill="#F5B544">›</text>
  <g>
    <text class="ln l0" x="106" y="263" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="20" fill="#E6EDF7">django-rest api  ·  jwt auth, boards, cards, attachments</text>
    <text class="ln l1" x="106" y="263" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="20" fill="#E6EDF7">keras transfer learning  ·  4 cnn models on brain mri</text>
    <text class="ln l2" x="106" y="263" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="20" fill="#E6EDF7">react native  ·  webrtc voice calling over sip</text>
    <text class="ln l3" x="106" y="263" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="20" fill="#E6EDF7">node + github actions  ·  tested content pipeline</text>
  </g>

