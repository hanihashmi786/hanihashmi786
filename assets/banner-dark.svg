    <rect x="882" y="235" width="76" height="34" rx="8" fill="#111A2E" stroke="#1E293B" stroke-width="1.5"/>
    <text x="920" y="257" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#8B9BB4">model</text>
    <rect x="1128" y="229" width="76" height="34" rx="8" fill="#111A2E" stroke="#1E293B" stroke-width="1.5"/>
